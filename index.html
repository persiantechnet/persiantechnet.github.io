<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persia OS Ultimate v14.0 - سیستم عامل کامل پارسی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS کامل در ادامه... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00aaff; --primary-dark: #0099ee; --secondary: #9d50bb;
            --success: #2ecc71; --error: #e74c3c; --warning: #f1c40f;
            --dark: #0a0a15; --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(0,170,255,0.3);
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark); color: white; height: 100vh; overflow: hidden; }
        /* والپیپر زنده */
        .live-wallpaper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; transition: 0.5s; }
        .wallpaper-default { background: radial-gradient(circle at 20% 40%, #0a0a2a, #000010); animation: galaxyMove 20s infinite; }
        .wallpaper-matrix { background: linear-gradient(135deg, #003300, #000000); }
        .wallpaper-sunset { background: linear-gradient(135deg, #ff6b35, #f7931e, #2c3e50); animation: sunsetPulse 15s infinite; }
        .wallpaper-ocean { background: linear-gradient(135deg, #003366, #006699, #0099cc); animation: oceanWave 10s infinite; }
        @keyframes galaxyMove { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
        @keyframes sunsetPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
        @keyframes oceanWave { 0% { background-size: 100% 100%; } 100% { background-size: 120% 120%; } }
        /* بوت اسکرین */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .boot-progress { width: 300px; height: 4px; background: #333; margin: 1rem auto; border-radius: 2px; overflow: hidden; }
        .boot-progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        /* تسکبار و دسکتاپ */
        .taskbar { position: fixed; bottom: 0; left: 0; right: 0; height: 55px; background: rgba(10,10,21,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); display: none; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 1000; }
        .desktop-icons { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .desktop-icon { width: 90px; padding: 12px 8px; text-align: center; background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 16px; cursor: pointer; transition: 0.3s; }
        .desktop-icon:hover { transform: translateY(-5px); border-color: var(--primary); }
        /* پنجره‌ها */
        .window { position: absolute; background: rgba(20,20,40,0.95); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; min-width: 400px; min-height: 350px; display: flex; flex-direction: column; z-index: 500; overflow: hidden; }
        .window-header { padding: 12px 18px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; cursor: move; }
        .window-controls { display: flex; gap: 10px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .win-close { background: var(--error); }
        .win-minimize { background: var(--warning); }
        .win-maximize { background: var(--success); }
        .window-content { padding: 20px; flex: 1; overflow-y: auto; max-height: 70vh; }
        /* فایل منیجر */
        .file-item { padding: 10px; margin: 5px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .file-item:hover { background: rgba(0,170,255,0.3); }
        .folder { border-right: 3px solid var(--primary); }
        /* ترمینال */
        .terminal { background: #000; color: #0f0; font-family: monospace; padding: 15px; height: 100%; overflow-y: auto; }
        .terminal-input { background: transparent; border: none; color: #0f0; width: 100%; outline: none; font-family: monospace; }
        /* مدیا پلیر */
        .media-player { text-align: center; }
        .media-controls { display: flex; gap: 15px; justify-content: center; margin: 15px 0; }
        .media-btn { background: var(--primary); border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; }
        /* اداری */
        .office-card { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin: 10px 0; }
        /* هوش مصنوعی پیشرفته */
        .ai-response { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin: 5px 0; }
        /* ریسپانسیو */
        @media (max-width: 768px) { .window { min-width: 90vw; left: 5vw !important; } .desktop-icon { width: 70px; } }
    </style>
</head>
<body>

<div id="boot-screen"><div class="boot-container"><div class="boot-logo">📡</div><div class="boot-title">Persia OS Ultimate v14.0</div><div class="boot-progress"><div class="boot-progress-fill" id="boot-progress"></div></div><div class="boot-message" id="boot-message">در حال بارگذاری...</div></div></div>

<div id="auth-screen" style="display:none;"><div class="auth-card"><div class="auth-tabs"><button class="auth-tab active" data-tab="login">🔐 ورود</button><button class="auth-tab" data-tab="register">📝 ثبت‌نام</button></div>
<div id="login-form" class="auth-form active"><input type="text" id="login-username" placeholder="نام کاربری"><input type="password" id="login-password" placeholder="رمز عبور"><button onclick="handleLogin()">✨ ورود</button><button onclick="guestLogin()">👤 مهمان</button><div id="login-error"></div></div>
<div id="register-form" class="auth-form"><input type="text" id="reg-username" placeholder="نام کاربری"><input type="password" id="reg-password" placeholder="رمز عبور (min 4)"><input type="text" id="reg-name" placeholder="نام کامل"><button onclick="handleRegister()">📝 ثبت‌نام</button><div id="register-error"></div><div id="register-success"></div></div></div></div>

<div id="desktop" style="display:none;"><div class="live-wallpaper wallpaper-default" id="wallpaper"></div>
<div class="desktop-icons" id="desktop-icons"></div>
<div class="taskbar"><button class="start-btn" onclick="toggleStartMenu()">🚀 شروع</button><div class="taskbar-apps" id="taskbar-apps"></div><div class="taskbar-right"><span id="taskbar-time"></span><span id="taskbar-user"></span><span id="taskbar-battery">🔋 100%</span></div></div>
<div id="start-menu"><div class="start-header"><div class="start-user" id="start-username"></div><div class="start-user-status" id="start-role"></div></div><div id="start-menu-content"></div></div>
<div class="ai-fab" onclick="toggleAI()">🧠</div><div class="ai-panel" id="ai-panel"><h3>🤖 Persia AI Pro</h3><div id="ai-chat" style="height:200px; overflow:auto; background:rgba(0,0,0,0.3); border-radius:12px; padding:10px;"></div><textarea id="ai-input" placeholder="سوال..."></textarea><button onclick="askAI()">ارسال</button></div>
<div id="notification-center"></div></div>

<script>
// ==================== دیتابیس کامل ====================
let users = JSON.parse(localStorage.getItem('persia_users_v3')) || {};
let currentUser = null, isGuest = false, activeWindows = new Set(), windowZ = 1000;

// دیتاهای ذخیره شده
let globalChat = JSON.parse(localStorage.getItem('global_chat')) || [];
let userFiles = JSON.parse(localStorage.getItem('user_files')) || {};
let trashFiles = JSON.parse(localStorage.getItem('trash_files')) || [];
let mediaLibrary = JSON.parse(localStorage.getItem('media_library')) || [];
let blogPosts = JSON.parse(localStorage.getItem('blog_posts')) || [
    { id: 1, title: 'خوش آمدید به Persia OS', content: 'این اولین پست بلاگ سیستم عامل پارسی است.', author: 'admin', date: new Date().toISOString() }
];
let officeDocs = JSON.parse(localStorage.getItem('office_docs')) || [];
let hardwareInfo = { browser: navigator.userAgent, platform: navigator.platform, language: navigator.language, online: navigator.onLine };

// آیکون‌های دسکتاپ کامل
const desktopIconsConfig = [
    { id: 'filemanager', icon: '📁', label: 'مدیریت فایل', roles: ['user','admin'] },
    { id: 'media', icon: '🎵', label: 'مدیا پلیر', roles: ['user','admin'] },
    { id: 'chat', icon: '💬', label: 'چت گروهی', roles: ['user','admin','guest'] },
    { id: 'terminal', icon: '💻', label: 'ترمینال', roles: ['user','admin'] },
    { id: 'browser', icon: '🌐', label: 'مرورگر', roles: ['user','admin'] },
    { id: 'office', icon: '📊', label: 'اداری', roles: ['user','admin'] },
    { id: 'editor', icon: '✏️', label: 'ویرایشگر متن', roles: ['user','admin'] },
    { id: 'blog', icon: '📰', label: 'بلاگ', roles: ['user','admin'] },
    { id: 'profile', icon: '👤', label: 'پروفایل', roles: ['user','admin'] },
    { id: 'store', icon: '🛒', label: 'فروشگاه', roles: ['user','admin'] },
    { id: 'trash', icon: '🗑️', label: 'سطل زباله', roles: ['user','admin'] },
    { id: 'wallpaper', icon: '🖌️', label: 'والپیپر', roles: ['user','admin'] },
    { id: 'settings', icon: '⚙️', label: 'تنظیمات', roles: ['user','admin'] },
    { id: 'about', icon: 'ℹ️', label: 'درباره ما', roles: ['user','admin'] },
    { id: 'contact', icon: '📞', label: 'ارتباط با ما', roles: ['user','admin'] },
    { id: 'map', icon: '🗺️', label: 'نقشه', roles: ['user','admin'] },
    { id: 'stats', icon: '📈', label: 'آمار سیستم', roles: ['user','admin'] }
];
if (currentUser?.role === 'admin') desktopIconsConfig.push({ id: 'admin', icon: '👑', label: 'مدیریت', roles: ['admin'] });

// ایجاد ادمین پیش‌فرض
if (!users['admin']) {
    users['admin'] = { password: btoa('admin123'), name: 'مدیر سیستم', role: 'admin', avatar: '', joinDate: new Date().toISOString(), isActive: true, stats: { logins: 0 } };
    localStorage.setItem('persia_users_v3', JSON.stringify(users));
}

// ==================== بوت و توابع اصلی ====================
function bootSystem() {
    let progress = 0, idx = 0;
    const msgs = ['بارگذاری هسته...', 'بررسی سخت افزار...', 'اتصال به حافظه...', 'راه‌اندازی سرویس‌ها...', 'آماده سازی محیط...'];
    let int = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) progress = 100;
        document.getElementById('boot-progress').style.width = progress + '%';
        if (idx < msgs.length) document.getElementById('boot-message').innerText = msgs[idx++];
        if (progress === 100) {
            clearInterval(int);
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('auth-screen').style.display = 'flex';
                setTimeout(() => document.getElementById('auth-screen').style.opacity = '1', 50);
            }, 500);
        }
    }, 200);
}

function handleLogin() {
    let username = document.getElementById('login-username').value.trim();
    let pass = document.getElementById('login-password').value;
    let user = users[username];
    if (!user || atob(user.password) !== pass) {
        document.getElementById('login-error').innerText = 'نام کاربری یا رمز اشتباه';
        return;
    }
    if (!user.isActive) { showNotif('حساب غیرفعال است', 'error'); return; }
    currentUser = { username, name: user.name, role: user.role, avatar: user.avatar };
    user.stats = user.stats || { logins: 0 };
    user.stats.logins++;
    localStorage.setItem('persia_users_v3', JSON.stringify(users));
    isGuest = false;
    completeLogin();
}

function handleRegister() {
    let username = document.getElementById('reg-username').value.trim();
    let pass = document.getElementById('reg-password').value;
    let name = document.getElementById('reg-name').value.trim();
    if (!username || !pass || pass.length < 4) { showRegError('رمز حداقل 4 کاراکتر'); return; }
    if (users[username]) { showRegError('نام کاربری تکراری'); return; }
    users[username] = { password: btoa(pass), name: name || username, role: 'user', avatar: '', joinDate: new Date().toISOString(), isActive: true, stats: { logins: 1 } };
    localStorage.setItem('persia_users_v3', JSON.stringify(users));
    document.getElementById('register-success').innerText = 'ثبت‌نام موفق!';
    setTimeout(() => document.querySelector('.auth-tab[data-tab="login"]').click(), 1500);
}

function guestLogin() { currentUser = { username: 'مهمان', name: 'کاربر مهمان', role: 'guest' }; isGuest = true; completeLogin(); }

function completeLogin() {
    document.getElementById('auth-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
        document.querySelector('.taskbar').style.display = 'flex';
        updateUI();
        startServices();
        showNotif(`به Persia OS خوش آمدید ${currentUser.name}`, 'success');
        checkHardware();
    }, 500);
}

function checkHardware() {
    let info = `🖥️ سیستم: ${hardwareInfo.platform} | 🌐 مرورگر: ${hardwareInfo.browser.split(' ')[0]} | 🔋 وضعیت: ${hardwareInfo.online ? 'آنلاین' : 'آفلاین'}`;
    showNotif(info, 'info');
}

function updateUI() {
    document.getElementById('start-username').innerHTML = `${currentUser.name} 🟢`;
    document.getElementById('start-role').innerHTML = currentUser.role === 'admin' ? 'مدیر سیستم' : (isGuest ? 'مهمان' : 'کاربر');
    document.getElementById('taskbar-user').innerHTML = `👤 ${currentUser.name}`;
    buildDesktopIcons();
    buildStartMenu();
    updateDateTime();
    setInterval(updateDateTime, 1000);
    setInterval(() => { document.getElementById('taskbar-battery').innerHTML = `🔋 ${Math.floor(Math.random() * 30 + 70)}%`; }, 30000);
}

function buildDesktopIcons() {
    let container = document.getElementById('desktop-icons');
    let visibleIcons = desktopIconsConfig.filter(i => i.roles.includes(currentUser.role) && !(isGuest && i.id !== 'chat' && i.id !== 'about'));
    container.innerHTML = visibleIcons.map(i => `<div class="desktop-icon" onclick="openApp('${i.id}')"><div class="icon">${i.icon}</div><div class="label">${i.label}</div></div>`).join('');
}

function buildStartMenu() {
    let items = ['filemanager','media','chat','terminal','browser','office','editor','blog','profile','store','settings'];
    let html = `<div class="start-category"><div class="start-category-title">📱 برنامه‌ها</div>`;
    items.forEach(i => { let icon = desktopIconsConfig.find(c => c.id === i); if(icon && (icon.roles.includes(currentUser.role) || isGuest)) html += `<div class="start-item" onclick="openApp('${i}'); toggleStartMenu()">${icon.icon} ${icon.label}</div>`; });
    html += `</div><div class="start-category"><div class="start-category-title">⚙️ سیستم</div>`;
    html += `<div class="start-item" onclick="logout()">🚪 خروج</div><div class="start-item" onclick="shutdown()">🔌 خاموش</div></div>`;
    document.getElementById('start-menu-content').innerHTML = html;
}

// ==================== پنجره‌ها ====================
function createWindow(id, title, content, w = 550, h = 450) {
    let exist = document.getElementById(`win-${id}`);
    if (exist) { exist.style.display = 'flex'; exist.style.zIndex = ++windowZ; return; }
    let win = document.createElement('div');
    win.className = 'window'; win.id = `win-${id}`;
    win.style.width = w + 'px'; win.style.height = h + 'px';
    win.style.left = (100 + Math.random() * 200) + 'px'; win.style.top = (80 + Math.random() * 100) + 'px';
    win.innerHTML = `<div class="window-header"><span>${title}</span><div class="window-controls"><div class="win-btn win-minimize" onclick="document.getElementById('win-${id}').style.display='none'"></div><div class="win-btn win-maximize" onclick="toggleMaximize('${id}')"></div><div class="win-btn win-close" onclick="closeWindow('${id}')"></div></div></div><div class="window-content">${content}</div>`;
    document.body.appendChild(win);
    makeDraggable(win);
    activeWindows.add(id);
    addToTaskbar(id, title);
    return win;
}

function closeWindow(id) { let w = document.getElementById(`win-${id}`); if (w) w.remove(); activeWindows.delete(id); removeTaskbar(id); }
function addToTaskbar(id, title) { if (!document.querySelector(`.taskbar-app[data-id="${id}"]`)) { let btn = document.createElement('div'); btn.className = 'taskbar-app'; btn.setAttribute('data-id', id); btn.innerHTML = `📌 ${title}`; btn.onclick = () => { let w = document.getElementById(`win-${id}`); if (w) w.style.display = 'flex'; }; document.getElementById('taskbar-apps').appendChild(btn); } }
function removeTaskbar(id) { let btn = document.querySelector(`.taskbar-app[data-id="${id}"]`); if (btn) btn.remove(); }
function toggleMaximize(id) { let win = document.getElementById(`win-${id}`); if (win.style.width === '90%') { win.style.width = '550px'; win.style.height = '450px'; win.style.left = '100px'; } else { win.style.width = '90%'; win.style.height = '80%'; win.style.left = '5%'; win.style.top = '5%'; } }
function makeDraggable(win) { let header = win.querySelector('.window-header'); let isDown = false, offX, offY; header.addEventListener('mousedown', (e) => { if (e.target.closest('.window-controls')) return; isDown = true; offX = e.clientX - win.offsetLeft; offY = e.clientY - win.offsetTop; win.style.zIndex = ++windowZ; }); document.addEventListener('mousemove', (e) => { if (!isDown) return; win.style.left = (e.clientX - offX) + 'px'; win.style.top = (e.clientY - offY) + 'px'; }); document.addEventListener('mouseup', () => isDown = false); }

// ==================== برنامه‌های اصلی ====================
window.openApp = function(id) {
    const apps = {
        filemanager: openFileManager, media: openMediaPlayer, chat: openChat, terminal: openTerminal,
        browser: openBrowser, office: openOffice, editor: openEditor, blog: openBlog, profile: openProfile,
        store: openStore, trash: openTrash, wallpaper: openWallpaper, settings: openSettings,
        about: openAbout, contact: openContact, map: openMap, stats: openStats, admin: openAdmin
    };
    if (apps[id]) apps[id]();
};

// 1. مدیریت فایل کامل
function openFileManager() {
    let files = userFiles[currentUser?.username] || [];
    let filesHtml = files.map((f, i) => `<div class="file-item ${f.type === 'folder' ? 'folder' : ''}" onclick="openFileItem(${i})"><span>${f.type === 'folder' ? '📁' : '📄'} ${f.name}</span><div><button onclick="deleteFileItem(${i}, event)">🗑️</button></div></div>`).join('');
    createWindow('filemanager', '📁 مدیریت فایل', `
        <div style="margin-bottom:15px; display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="new-file-name" placeholder="نام جدید..." style="flex:1; background:rgba(0,0,0,0.3); border:none; padding:8px; border-radius:8px; color:white;">
            <button onclick="createFolder()" style="background:var(--primary); border:none; padding:8px 16px; border-radius:8px;">📁 پوشه جدید</button>
            <button onclick="uploadFile()" style="background:var(--success); border:none; padding:8px 16px; border-radius:8px;">📤 آپلود فایل</button>
        </div>
        <div id="file-list" style="max-height:300px; overflow-y:auto;">${filesHtml || '<div style="text-align:center; color:#888;">هیچ فایلی وجود ندارد</div>'}</div>
        <div style="margin-top:15px; background:rgba(0,0,0,0.2); padding:10px; border-radius:8px;">
            <small>💾 فضای استفاده شده: ${Math.floor(files.reduce((a,f)=>a+(f.size||0),0)/1024)} KB</small>
        </div>
    `, 550, 500);
}

function createFolder() {
    let name = document.getElementById('new-file-name')?.value.trim();
    if (!name) return;
    if (!userFiles[currentUser.username]) userFiles[currentUser.username] = [];
    userFiles[currentUser.username].push({ name, type: 'folder', size: 0, content: null, date: new Date().toISOString() });
    localStorage.setItem('user_files', JSON.stringify(userFiles));
    showNotif(`پوشه ${name} ساخته شد`, 'success');
    closeWindow('filemanager'); setTimeout(() => openFileManager(), 100);
}

function uploadFile() {
    let input = document.createElement('input');
    input.type = 'file';
    input.onchange = (e) => {
        let file = e.target.files[0];
        if (file) {
            let reader = new FileReader();
            reader.onload = (ev) => {
                if (!userFiles[currentUser.username]) userFiles[currentUser.username] = [];
                userFiles[currentUser.username].push({ name: file.name, type: 'file', size: file.size, content: ev.target.result, date: new Date().toISOString() });
                localStorage.setItem('user_files', JSON.stringify(userFiles));
                showNotif(`فایل ${file.name} آپلود شد`, 'success');
                closeWindow('filemanager'); setTimeout(() => openFileManager(), 100);
            };
            reader.readAsDataURL(file);
        }
    };
    input.click();
}

function deleteFileItem(index, event) {
    event.stopPropagation();
    let file = userFiles[currentUser.username][index];
    trashFiles.push({ ...file, deletedBy: currentUser.username, deletedAt: new Date().toISOString() });
    userFiles[currentUser.username].splice(index, 1);
    localStorage.setItem('user_files', JSON.stringify(userFiles));
    localStorage.setItem('trash_files', JSON.stringify(trashFiles));
    showNotif(`${file.name} به سطل زباله منتقل شد`, 'info');
    closeWindow('filemanager'); setTimeout(() => openFileManager(), 100);
}

function openFileItem(index) {
    let file = userFiles[currentUser.username][index];
    if (file.type === 'folder') {
        showNotif(`باز کردن پوشه ${file.name}`, 'info');
    } else if (file.content) {
        if (file.name.match(/\.(jpg|png|gif|jpeg)$/i)) {
            createWindow('preview', '🖼️ پیش‌نمایش', `<img src="${file.content}" style="max-width:100%; border-radius:12px;">`, 500, 500);
        } else if (file.name.match(/\.(mp3|wav|ogg)$/i)) {
            createWindow('preview', '🎵 پخش موسیقی', `<audio controls style="width:100%"><source src="${file.content}"></audio>`, 450, 200);
        } else if (file.name.match(/\.(mp4|webm|ogg)$/i)) {
            createWindow('preview', '🎬 پخش ویدیو', `<video controls style="width:100%"><source src="${file.content}"></video>`, 600, 400);
        } else {
            createWindow('preview', '📄 محتوای فایل', `<pre style="white-space:pre-wrap;word-break:break-all;">${file.content.substring(0, 5000)}</pre>`, 550, 450);
        }
    }
}

// 2. مدیا پلیر کامل با کتابخانه
function openMediaPlayer() {
    let libraryHtml = mediaLibrary.map((m, i) => `<div class="file-item" onclick="playMedia(${i})"><span>${m.type === 'audio' ? '🎵' : '🎬'} ${m.name}</span><button onclick="removeFromLibrary(${i}, event)">🗑️</button></div>`).join('');
    createWindow('media', '🎵 مدیا پلیر - کتابخانه', `
        <div class="media-player">
            <div id="media-player-area" style="background:rgba(0,0,0,0.3); border-radius:12px; padding:20px; margin-bottom:15px;">
                <div id="now-playing">🎵 هیچ مدیایی در حال پخش نیست</div>
                <audio id="audio-player" controls style="width:100%; margin-top:10px; display:none;"></audio>
                <video id="video-player" controls style="width:100%; margin-top:10px; display:none;"></video>
            </div>
            <div class="media-controls">
                <button class="media-btn" onclick="uploadToLibrary('audio')">🎵 آپلود موزیک</button>
                <button class="media-btn" onclick="uploadToLibrary('video')">🎬 آپلود فیلم</button>
            </div>
            <h4>📚 کتابخانه من (${mediaLibrary.length})</h4>
            <div id="media-library" style="max-height:250px; overflow-y:auto;">${libraryHtml || '<div style="text-align:center;">کتابخانه خالی است</div>'}</div>
        </div>
    `, 600, 550);
}

function uploadToLibrary(type) {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = type === 'audio' ? 'audio/*' : 'video/*';
    input.onchange = (e) => {
        let file = e.target.files[0];
        if (file) {
            let reader = new FileReader();
            reader.onload = (ev) => {
                mediaLibrary.push({ name: file.name, type: type, data: ev.target.result, addedBy: currentUser.username, date: new Date().toISOString() });
                localStorage.setItem('media_library', JSON.stringify(mediaLibrary));
                showNotif(`${file.name} به کتابخانه اضافه شد`, 'success');
                closeWindow('media'); setTimeout(() => openMediaPlayer(), 100);
            };
            reader.readAsDataURL(file);
        }
    };
    input.click();
}

function playMedia(index) {
    let media = mediaLibrary[index];
    let audio = document.getElementById('audio-player');
    let video = document.getElementById('video-player');
    if (media.type === 'audio') {
        audio.style.display = 'block';
        video.style.display = 'none';
        audio.src = media.data;
        audio.play();
        document.getElementById('now-playing').innerHTML = `🎵 در حال پخش: ${media.name}`;
    } else {
        audio.style.display = 'none';
        video.style.display = 'block';
        video.src = media.data;
        video.play();
        document.getElementById('now-playing').innerHTML = `🎬 در حال پخش: ${media.name}`;
    }
}

function removeFromLibrary(index, event) {
    event.stopPropagation();
    mediaLibrary.splice(index, 1);
    localStorage.setItem('media_library', JSON.stringify(mediaLibrary));
    showNotif('حذف شد', 'info');
    closeWindow('media'); setTimeout(() => openMediaPlayer(), 100);
}

function openTerminal() {
    createWindow('terminal', '💻 ترمینال Persia OS', `
        <div class="terminal" id="terminal-output" style="height:300px; overflow-y:auto; background:#000; color:#0f0; font-family:monospace; padding:10px;">
            <div>Persia OS Terminal v1.0</div>
            <div>نوشته help برای مشاهده دستورات</div>
            <div id="terminal-history"></div>
        </div>
        <div style="display:flex; margin-top:10px;">
            <span style="color:#0f0;">$></span>
            <input type="text" id="terminal-cmd" class="terminal-input" style="flex:1; background:#000; border:none; color:#0f0; outline:none;" onkeypress="if(event.key==='Enter') execCommand()">
        </div>
    `, 600, 450);
    setTimeout(() => document.getElementById('terminal-cmd')?.focus(), 100);
}

function execCommand() {
    let input = document.getElementById('terminal-cmd');
    let cmd = input.value.trim();
    let history = document.getElementById('terminal-history');
    if (!cmd) return;
    history.innerHTML += `<div><span style="color:#0f0;">$></span> ${cmd}</div>`;
    let output = '';
    if (cmd === 'help') output = 'دستورات: help, ls, clear, whoami, date, info, files';
    else if (cmd === 'ls') output = 'Desktop  Documents  Downloads  Pictures  Videos';
    else if (cmd === 'clear') { history.innerHTML = ''; input.value = ''; return; }
    else if (cmd === 'whoami') output = currentUser.username;
    else if (cmd === 'date') output = new Date().toString();
    else if (cmd === 'info') output = `Persia OS v14.0 | کاربر: ${currentUser.name} | نقش: ${currentUser.role}`;
    else if (cmd === 'files') output = `تعداد فایل‌ها: ${(userFiles[currentUser.username] || []).length}`;
    else output = `دستور ناشناخته: ${cmd}. برای راهنما help را وارد کنید.`;
    history.innerHTML += `<div>${output}</div>`;
    input.value = '';
    let term = document.getElementById('terminal-output');
    term.scrollTop = term.scrollHeight;
}

function saveTextFile() {
    let name = document.getElementById('editor-filename')?.value.trim();
    let content = document.getElementById('editor-content')?.value;
    if (!name) { showNotif('نام فایل را وارد کنید', 'error'); return; }
    if (!userFiles[currentUser.username]) userFiles[currentUser.username] = [];
    userFiles[currentUser.username].push({ name: name.endsWith('.txt') ? name : name+'.txt', type: 'file', size: content.length, content: btoa(unescape(encodeURIComponent(content))), date: new Date().toISOString() });
    localStorage.setItem('user_files', JSON.stringify(userFiles));
    showNotif(`فایل ${name} ذخیره شد`, 'success');
}

function loadTextFile() {
    let files = userFiles[currentUser.username] || [];
    let txtFiles = files.filter(f => f.name.endsWith('.txt'));
    if (txtFiles.length === 0) { showNotif('فایل متنی وجود ندارد', 'error'); return; }
    let list = txtFiles.map((f,i) => `<div onclick="openTextFile(${files.indexOf(f)})" style="padding:8px; background:rgba(0,0,0,0.3); margin:5px; border-radius:8px; cursor:pointer;">📄 ${f.name}</div>`).join('');
    createWindow('load-file', 'انتخاب فایل', list, 400, 300);
}

function openTextFile(index) {
    let file = userFiles[currentUser.username][index];
    if (file.content) {
        let content = decodeURIComponent(escape(atob(file.content)));
        document.getElementById('editor-content').value = content;
        document.getElementById('editor-filename').value = file.name.replace('.txt', '');
        closeWindow('load-file');
        showNotif(`فایل ${file.name} باز شد`, 'success');
    }
}

function formatText(type) {
    let area = document.getElementById('editor-content');
    let start = area.selectionStart;
    let end = area.selectionEnd;
    let text = area.value;
    let selected = text.substring(start, end);
    let replacement = '';
    if (type === 'bold') replacement = `**${selected}**`;
    else if (type === 'italic') replacement = `*${selected}*`;
    else if (type === 'underline') replacement = `__${selected}__`;
    area.value = text.substring(0, start) + replacement + text.substring(end);
    area.focus();
}

function toggleAI() { let p = document.getElementById('ai-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
function askAI() {
    let q = document.getElementById('ai-input').value.trim();
    if (!q) return;
    let chatDiv = document.getElementById('ai-chat');
    chatDiv.innerHTML += `<div class="ai-response" style="text-align:left; color:#86efac;">👤 ${escapeHtml(q)}</div>`;
    document.getElementById('ai-input').value = '';
    setTimeout(() => {
        let answer = generateAIResponse(q);
        chatDiv.innerHTML += `<div class="ai-response" style="text-align:right; color:var(--primary);">🤖 ${answer}</div>`;
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }, 300);
}

function generateAIResponse(q) {
    let lower = q.toLowerCase();
    if (lower.includes('سلام') || lower.includes('درود')) return 'سلام! وقت بخیر. به Persia OS خوش آمدید. چطور می‌توانم کمک کنم؟';
    if (lower.includes('فایل') || lower.includes('مدیریت فایل')) return 'برای مدیریت فایل‌ها، از آیکون 📁 روی دسکتاپ استفاده کنید. می‌توانید پوشه بسازید، فایل آپلود کنید و فایل‌های خود را مدیریت کنید.';
    if (lower.includes('موزیک') || lower.includes('موسیقی') || lower.includes('فیلم')) return 'به بخش مدیا پلیر بروید. می‌توانید موزیک و فیلم به کتابخانه اضافه کنید و پخش کنید.';
    if (lower.includes('ترمینال')) return 'ترمینال Persia OS از دستورات help, ls, clear, whoami, date, info, files پشتیبانی می‌کند.';
    if (lower.includes('مرورگر') || lower.includes('اینترنت')) return 'مرورگر Persia را باز کنید. می‌توانید هر سایتی را جستجو کنید.';
    if (lower.includes('اداری') || lower.includes('سند')) return 'سیستم اداری به شما امکان ایجاد، ویرایش و مدیریت اسناد را می‌دهد.';
    if (lower.includes('والپیپر')) return 'برای تغییر والپیپر، از بخش والپیپر استفاده کنید. والپیپرهای زنده با انیمیشن در دسترس هستند.';
    if (lower.includes('ادمین') || lower.includes('مدیر')) return currentUser.role === 'admin' ? 'شما مدیر سیستم هستید. می‌توانید کاربران را مدیریت کنید.' : 'برای دسترسی به پنل مدیریت به حساب ادمین نیاز دارید.';
    if (lower.includes('حافظه') || lower.includes('رم')) return `حافظه مصرفی: ${Math.floor(Math.random() * 50 + 30)}% | فضای ذخیره‌سازی: حدود ${Math.floor((userFiles[currentUser?.username] || []).reduce((a,f)=>a+(f.size||0),0)/1024)} KB استفاده شده.`;
    if (lower.includes('سخت افزار')) return `پلتفرم: ${hardwareInfo.platform} | مرورگر: ${hardwareInfo.browser.split(' ')[0]} | وضعیت: ${hardwareInfo.online ? 'آنلاین' : 'آفلاین'}`;
    return `پاسخ: ${q.substring(0, 50)}... سوال خوبی پرسیدید! من Persia AI هستم. می‌توانم در زمینه مدیریت فایل، مدیا، ترمینال، مرورگر، سیستم اداری و... کمک کنم.`;
}

// ==================== یوتیلیتی ====================
function showNotif(msg, type='info') { let div = document.createElement('div'); div.className = 'notification'; div.style.cssText = `position:fixed; top:20px; left:20px; background:rgba(10,10,21,0.95); border-radius:12px; padding:12px; border-right:3px solid ${type==='success'?'#2ecc71':type==='error'?'#e74c3c':'#f1c40f'}; z-index:2000; animation:slideIn 0.3s;`; div.innerHTML = `<strong>${type==='success'?'✓':type==='error'?'⚠':'ℹ'}</strong> ${msg}`; document.body.appendChild(div); setTimeout(()=>div.remove(),4000); }
function updateDateTime() { document.getElementById('taskbar-time').innerHTML = new Date().toLocaleTimeString('fa-IR'); }
function toggleStartMenu() { document.getElementById('start-menu').classList.toggle('show'); }
function escapeHtml(t) { let d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function logout() { if(confirm('خروج از سیستم؟')) location.reload(); }
function shutdown() { if(confirm('خاموش کردن سیستم؟')) document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:white"><h1>سیستم خاموش شد 🔴</h1><p style="margin-top:20px;">برای راه‌اندازی مجدد صفحه را رفرش کنید</p></div>'; }
function startServices() { let saved = localStorage.getItem('selected_wallpaper'); if(saved) setWallpaper(saved); }
document.addEventListener('click', (e) => { if(!e.target.closest('#start-menu') && !e.target.closest('.start-btn')) document.getElementById('start-menu')?.classList.remove('show'); if(!e.target.closest('#ai-panel') && !e.target.closest('.ai-fab')) document.getElementById('ai-panel')?.style.display='none'; });
document.querySelectorAll('.auth-tab').forEach(t=>{ t.addEventListener('click',()=>{ document.querySelectorAll('.auth-tab').forEach(ta=>ta.classList.remove('active')); t.classList.add('active'); let target=t.dataset.tab; document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active')); document.getElementById(`${target}-form`).classList.add('active'); }); });
function showRegError(msg) { let e=document.getElementById('register-error'); e.innerText=msg; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }
document.addEventListener('DOMContentLoaded', bootSystem);
</script>
</body>
