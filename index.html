<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Persia OS Ultimate - سیستم عامل هوشمند پارسی</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00aaff;
            --primary-dark: #0099ee;
            --secondary: #9d50bb;
            --accent: #00ffff;
            --success: #2ecc71;
            --error: #e74c3c;
            --warning: #f1c40f;
            --info: #3498db;
            --dark: #0e0e1a;
            --darker: #0a0a12;
            --light: #ffffff;
            --gray: #64748b;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(0, 170, 255, 0.4);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --glow: 0 0 30px rgba(0, 170, 255, 0.4);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', 'Vazirmatn', Tahoma, sans-serif;
            background: var(--dark);
            color: var(--light);
            height: 100vh;
            overflow: hidden;
        }
        /* Boot Screen */
        #boot-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--dark), var(--darker));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 1s ease;
        }
        .boot-container { text-align: center; animation: fadeInUp 0.5s ease; }
        .boot-logo { font-size: 5rem; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; color: var(--primary); }
        .boot-title { font-size: 2rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 2rem; }
        .boot-progress { width: 350px; height: 4px; background: var(--glass); border-radius: 2px; overflow: hidden; margin: 1rem auto; border: 1px solid var(--glass-border); }
        .boot-progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: width 0.3s; }
        .boot-message { color: var(--gray); font-size: 0.85rem; margin-top: 1rem; }
        /* Auth Screen */
        #auth-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--dark), #1e1b4b);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.8s ease;
            overflow-y: auto;
        }
        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            width: 450px;
            max-width: 90%;
            margin: 20px;
        }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); }
        .auth-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; background: none; border: none; color: var(--gray); font-size: 1rem; transition: all 0.3s; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: white;
            font-size: 1rem;
        }
        .auth-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary); }
        .auth-btn {
            width: 100%; padding: 12px; margin-top: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: var(--radius-md);
            color: white; font-weight: bold; cursor: pointer;
            transition: all 0.3s;
        }
        .guest-btn {
            background: linear-gradient(135deg, var(--gray), #4a5568);
            margin-top: 10px;
        }
        .auth-error { color: var(--error); margin-top: 10px; font-size: 0.85rem; display: none; }
        .auth-success { color: var(--success); margin-top: 10px; font-size: 0.85rem; display: none; }
        /* Desktop */
        #desktop {
            width: 100%; height: calc(100vh - 60px);
            background: radial-gradient(circle at 20% 80%, rgba(0,170,255,0.1), transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(157,80,187,0.1), transparent 50%),
                        var(--dark);
            display: none;
            position: relative;
            overflow: hidden;
        }
        .desktop-icons {
            position: absolute;
            top: 20px; right: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        .desktop-icon {
            width: 90px; padding: 12px 8px;
            text-align: center; cursor: pointer;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            transition: all 0.3s ease;
        }
        .desktop-icon:hover {
            background: var(--glass-hover);
            transform: translateY(-5px) scale(1.05);
            border-color: var(--primary);
            box-shadow: var(--glow);
        }
        .desktop-icon .icon { font-size: 2rem; margin-bottom: 5px; }
        .desktop-icon .label { font-size: 0.75rem; }
        .desktop-icon.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .taskbar {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }
        .start-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; padding: 8px 20px;
            border-radius: var(--radius-md);
            color: white; font-weight: bold;
            cursor: pointer;
        }
        .taskbar-apps { display: flex; gap: 8px; flex: 1; justify-content: center; }
        .taskbar-app {
            background: var(--glass); padding: 6px 14px;
            border-radius: var(--radius-md); font-size: 0.75rem;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }
        .taskbar-app.active { background: rgba(0,170,255,0.3); border-bottom: 2px solid var(--primary); }
        .taskbar-right { display: flex; gap: 15px; align-items: center; font-size: 0.8rem; }
        #start-menu {
            position: fixed; bottom: 65px; left: 20px;
            width: 350px; max-height: 70vh;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            display: none; z-index: 1100;
            overflow-y: auto;
        }
        #start-menu.show { display: block; animation: fadeInUp 0.3s ease; }
        .start-header { background: linear-gradient(135deg, var(--primary-dark), var(--dark)); padding: 20px; text-align: center; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
        .start-user { font-size: 1.2rem; font-weight: bold; }
        .start-user-status { font-size: 0.7rem; color: var(--success); }
        .start-category { padding: 10px; }
        .start-category-title { padding: 8px 12px; font-size: 0.7rem; color: var(--primary); }
        .start-item {
            padding: 10px 12px; border-radius: var(--radius-md);
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: all 0.2s; color: white;
        }
        .start-item:hover { background: rgba(0,170,255,0.3); transform: translateX(-5px); }
        .start-item.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        /* Window System */
        .window {
            position: absolute;
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            min-width: 400px; min-height: 350px;
            display: flex; flex-direction: column;
            z-index: 500; overflow: hidden;
        }
        .window-header {
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3);
            display: flex; justify-content: space-between;
            align-items: center; cursor: move;
            border-bottom: 1px solid var(--glass-border);
        }
        .window-title { font-weight: bold; }
        .window-controls { display: flex; gap: 10px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .win-close { background: var(--error); }
        .win-minimize { background: var(--warning); }
        .win-maximize { background: var(--success); }
        .window-content { padding: 20px; flex: 1; overflow-y: auto; }
        /* Widgets */
        .system-widget {
            position: fixed; bottom: 70px; right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 10px 15px;
            border-radius: var(--radius-lg);
            font-size: 0.7rem;
            z-index: 900;
            display: none;
        }
        .ai-fab {
            position: fixed; bottom: 70px; left: 20px;
            width: 55px; height: 55px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 900;
            box-shadow: var(--shadow), var(--glow);
            animation: float 3s ease-in-out infinite;
        }
        .ai-panel {
            position: fixed; bottom: 135px; left: 20px;
            width: 350px;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 15px;
            display: none; z-index: 901;
        }
        .notification-center {
            position: fixed; top: 20px; left: 20px;
            width: 340px; z-index: 2000;
        }
        .notification {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            padding: 12px 15px; margin-bottom: 10px;
            border-right: 3px solid var(--primary);
            animation: slideIn 0.3s;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--glass); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }
        @media (max-width: 768px) {
            .window { min-width: 90vw; min-height: 60vh; left: 5vw !important; }
            .desktop-icon { width: 75px; }
        }
    </style>
</head>
<body>

<!-- Boot Screen -->
<div id="boot-screen">
    <div class="boot-container">
        <div class="boot-logo">📡</div>
        <div class="boot-title">Persia OS Quantum Ultimate v12.0</div>
        <div class="boot-progress"><div class="boot-progress-fill" id="boot-progress"></div></div>
        <div class="boot-message" id="boot-message">در حال بارگذاری هسته سیستم...</div>
    </div>
</div>

<!-- Auth Screen (Login & Register) -->
<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">🔐 ورود</button>
            <button class="auth-tab" data-tab="register">📝 ثبت‌نام</button>
        </div>
        
        <!-- Login Form -->
        <div id="login-form" class="auth-form active">
            <input type="text" id="login-username" class="auth-input" placeholder="نام کاربری">
            <input type="password" id="login-password" class="auth-input" placeholder="رمز عبور">
            <button class="auth-btn" onclick="handleLogin()">✨ ورود</button>
            <button class="auth-btn guest-btn" onclick="guestLogin()">👤 ورود به عنوان مهمان</button>
            <div id="login-error" class="auth-error"></div>
        </div>
        
        <!-- Register Form -->
        <div id="register-form" class="auth-form">
            <input type="text" id="reg-username" class="auth-input" placeholder="نام کاربری">
            <input type="password" id="reg-password" class="auth-input" placeholder="رمز عبور (حداقل 4 کاراکتر)">
            <input type="email" id="reg-email" class="auth-input" placeholder="ایمیل (اختیاری)">
            <button class="auth-btn" onclick="handleRegister()">📝 ثبت‌نام</button>
            <div id="register-error" class="auth-error"></div>
            <div id="register-success" class="auth-success"></div>
        </div>
    </div>
</div>

<!-- Desktop -->
<div id="desktop">
    <div class="desktop-icons" id="desktop-icons">
        <!-- آیکون‌ها توسط JS بر اساس نقش کاربر ساخته می‌شوند -->
    </div>

    <div class="taskbar">
        <button class="start-btn" onclick="toggleStartMenu()">🚀 شروع</button>
        <div class="taskbar-apps" id="taskbar-apps"></div>
        <div class="taskbar-right">
            <span id="taskbar-time">--:--</span>
            <span id="taskbar-user">👤</span>
        </div>
    </div>

    <div id="start-menu">
        <div class="start-header">
            <div class="start-user" id="start-username">کاربر</div>
            <div class="start-user-status" id="start-user-role">🟢 آنلاین</div>
        </div>
        <div id="start-menu-content"></div>
    </div>

    <div class="system-widget" id="system-widget">
        <div>🖥️ CPU: <span id="cpu-usage">0</span>%</div>
        <div>💾 RAM: <span id="ram-usage">0</span>%</div>
    </div>

    <div class="ai-fab" onclick="toggleAIPanel()">🧠</div>
    <div class="ai-panel" id="ai-panel">
        <h3 style="color: var(--primary); margin-bottom: 10px;">🤖 Persia AI</h3>
        <div id="ai-conversation" style="height: 200px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: var(--radius-md); padding: 10px; margin-bottom: 10px;">
            <div style="color: var(--success);">سلام! به Persia OS خوش آمدید. چطور میتونم کمک کنم؟</div>
        </div>
        <textarea id="ai-input" placeholder="سوال خود را بپرسید..." style="width: 100%; background: rgba(0,0,0,0.3); border: none; border-radius: var(--radius-md); padding: 10px; color: white; resize: none;"></textarea>
        <button onclick="askAI()" style="width: 100%; margin-top: 10px; padding: 10px; background: var(--primary); border: none; border-radius: var(--radius-md); color: white; cursor: pointer;">ارسال</button>
    </div>

    <div class="notification-center" id="notification-center"></div>
</div>

<script>
// ============================================
// Persia OS Ultimate v12.0 - Complete Auth System
// ============================================

// ========== 1. مدیریت کاربران ==========
let currentUser = null;
let isGuest = false;

// ساختار کاربران
let users = JSON.parse(localStorage.getItem('persia_users')) || {};

// ایجاد کاربر ادمین پیش‌فرض (اگر وجود نداشته باشد)
if (!users['admin']) {
    users['admin'] = {
        password: btoa('admin123'),
        email: 'admin@persiaos.ir',
        role: 'admin',
        avatar: '👑',
        createdAt: new Date().toISOString(),
        isActive: true
    };
    localStorage.setItem('persia_users', JSON.stringify(users));
}

// ========== 2. ذخیره‌سازی داده‌های برنامه ==========
let chatMessages = JSON.parse(localStorage.getItem('persia_chat')) || [];
let galleryImages = JSON.parse(localStorage.getItem('persia_gallery')) || [];
let notes = JSON.parse(localStorage.getItem('persia_notes')) || [{ title: 'خوش آمدید', content: 'به Persia OS خوش آمدید!', date: new Date().toISOString(), userId: 'system' }];

// ========== 3. بوت سیستم ==========
function bootSystem() {
    let progress = 0;
    const messages = ['بارگذاری هسته سیستم...', 'راه‌اندازی ماژول‌های امنیتی...', 'اتصال به حافظه مجازی...', 'راه‌اندازی سرویس‌های شبکه...', 'آماده‌سازی محیط کاربری...', 'سیستم آماده است!'];
    let msgIndex = 0;
    const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) progress = 100;
        document.getElementById('boot-progress').style.width = progress + '%';
        if (msgIndex < messages.length) document.getElementById('boot-message').textContent = messages[msgIndex++];
        if (progress === 100) {
            clearInterval(interval);
            setTimeout(() => {
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('auth-screen').style.display = 'flex';
                    setTimeout(() => document.getElementById('auth-screen').style.opacity = '1', 50);
                }, 500);
            }, 300);
        }
    }, 200);
}

// ========== 4. توابع احراز هویت ==========
function handleLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    
    if (!username || !password) {
        errorEl.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید';
        errorEl.style.display = 'block';
        return;
    }
    
    const user = users[username];
    if (!user || atob(user.password) !== password) {
        errorEl.textContent = 'نام کاربری یا رمز عبور اشتباه است';
        errorEl.style.display = 'block';
        setTimeout(() => errorEl.style.display = 'none', 3000);
        return;
    }
    
    if (!user.isActive) {
        errorEl.textContent = 'حساب کاربری شما غیرفعال است. با مدیر تماس بگیرید.';
        errorEl.style.display = 'block';
        return;
    }
    
    currentUser = { username, email: user.email, role: user.role, avatar: user.avatar };
    isGuest = false;
    completeLogin();
}

function handleRegister() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value;
    const email = document.getElementById('reg-email').value.trim();
    const errorEl = document.getElementById('register-error');
    const successEl = document.getElementById('register-success');
    
    errorEl.style.display = 'none';
    successEl.style.display = 'none';
    
    if (!username || !password) {
        errorEl.textContent = 'نام کاربری و رمز عبور الزامی هستند';
        errorEl.style.display = 'block';
        return;
    }
    
    if (password.length < 4) {
        errorEl.textContent = 'رمز عبور باید حداقل 4 کاراکتر باشد';
        errorEl.style.display = 'block';
        return;
    }
    
    if (users[username]) {
        errorEl.textContent = 'این نام کاربری قبلاً ثبت شده است';
        errorEl.style.display = 'block';
        return;
    }
    
    users[username] = {
        password: btoa(password),
        email: email || '',
        role: 'user',
        avatar: '👤',
        createdAt: new Date().toISOString(),
        isActive: true
    };
    localStorage.setItem('persia_users', JSON.stringify(users));
    
    successEl.textContent = 'ثبت‌نام با موفقیت انجام شد! اکنون می‌توانید وارد شوید.';
    successEl.style.display = 'block';
    
    // پاک کردن فرم
    document.getElementById('reg-username').value = '';
    document.getElementById('reg-password').value = '';
    document.getElementById('reg-email').value = '';
    
    // تغییر به تب لاگین
    document.querySelector('.auth-tab[data-tab="login"]').click();
}

function guestLogin() {
    currentUser = { username: 'مهمان', email: '', role: 'guest', avatar: '👤' };
    isGuest = true;
    completeLogin();
}

function completeLogin() {
    document.getElementById('auth-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
        document.querySelector('.taskbar').style.display = 'flex';
        document.getElementById('system-widget').style.display = 'block';
        
        updateUIForUser();
        startSystemServices();
        showNotification(`به Persia OS خوش آمدید ${currentUser.username}!`, 'success');
        
        // نمایش پیام ویژه برای مهمان
        if (isGuest) {
            setTimeout(() => {
                showNotification('⚠️ شما به عنوان مهمان وارد شده‌اید. برای استفاده کامل از قابلیت‌ها، ثبت‌نام کنید.', 'warning');
            }, 1000);
        }
    }, 500);
}

function updateUIForUser() {
    document.getElementById('start-username').innerHTML = `${currentUser.username} <span style="color:#2ecc71;">●</span>`;
    document.getElementById('start-user-role').innerHTML = isGuest ? '👤 حالت مهمان (محدود)' : `👑 نقش: ${currentUser.role === 'admin' ? 'مدیر سیستم' : 'کاربر عادی'}`;
    document.getElementById('taskbar-user').innerHTML = `👤 ${currentUser.username}`;
    
    // ساخت آیکون‌های دسکتاپ بر اساس نقش
    buildDesktopIcons();
    buildStartMenu();
}

function buildDesktopIcons() {
    const container = document.getElementById('desktop-icons');
    const allIcons = [
        { id: 'chat', icon: '💬', label: 'چت گروهی', roles: ['user', 'admin'] },
        { id: 'media', icon: '🎵', label: 'پخش موسیقی', roles: ['user', 'admin'] },
        { id: 'notes', icon: '📓', label: 'یادداشت‌ها', roles: ['user', 'admin'] },
        { id: 'gallery', icon: '🖼️', label: 'گالری', roles: ['user', 'admin'] },
        { id: 'calculator', icon: '🧮', label: 'ماشین حساب', roles: ['user', 'admin'] },
        { id: 'filemanager', icon: '📁', label: 'مدیر فایل', roles: ['user', 'admin'] },
        { id: 'settings', icon: '⚙️', label: 'تنظیمات', roles: ['user', 'admin'] },

// ========== 6. مدیریت پنجره ==========
let activeWindows = new Set();
let windowZ = 1000;
let windowsState = {};

function addToTaskbar(appId, title) {
    const container = document.getElementById('taskbar-apps');
    if (document.querySelector(`.taskbar-app[data-id="${appId}"]`)) return;
    const btn = document.createElement('div');
    btn.className = 'taskbar-app';
    btn.setAttribute('data-id', appId);
    btn.innerHTML = `📌 ${title}`;
    btn.onclick = () => {
        const win = document.getElementById(`win-${appId}`);
        if (win) { win.style.display = 'flex'; win.style.zIndex = ++windowZ; }
    };
    container.appendChild(btn);
}

function removeFromTaskbar(appId) {
    const btn = document.querySelector(`.taskbar-app[data-id="${appId}"]`);
    if (btn) btn.remove();
}

function closeWindow(appId) {
    const win = document.getElementById(`win-${appId}`);
    if (win) win.remove();
    activeWindows.delete(appId);
    removeFromTaskbar(appId);
}

function minimizeWindow(appId) {
    const win = document.getElementById(`win-${appId}`);
    if (win) win.style.display = 'none';
}

function maximizeWindow(appId) {
    const win = document.getElementById(`win-${appId}`);
    if (!win) return;
    if (win.style.width === '90%') {
        win.style.width = windowsState[appId]?.width || '550px';
        win.style.height = windowsState[appId]?.height || '450px';
        win.style.left = windowsState[appId]?.left || '100px';
        win.style.top = windowsState[appId]?.top || '100px';
    } else {
        windowsState[appId] = { width: win.style.width, height: win.style.height, left: win.style.left, top: win.style.top };
        win.style.width = '90%'; win.style.height = '85%'; win.style.left = '5%'; win.style.top = '5%';
    }
    win.style.zIndex = ++windowZ;
}

function makeDraggable(win) {
    const header = win.querySelector('.window-header');
    let isDown = false, offsetX, offsetY;
    header.addEventListener('mousedown', (e) => {
        if (e.target.closest('.window-controls')) return;
        isDown = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
        win.style.zIndex = ++windowZ;
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
    });
    document.addEventListener('mouseup', () => { isDown = false; });
}

function createWindow(appId, title, content, width = 550, height = 450) {
    if (isGuest && appId !== 'org' && appId !== 'about') {
        showNotification('برای استفاده از این بخش لطفاً ثبت‌نام کنید', 'warning');
        promptRegister();
        return null;
    }
    
    const existing = document.getElementById(`win-${appId}`);
    if (existing) { existing.style.display = 'flex'; existing.style.zIndex = ++windowZ; return existing; }
    
    const win = document.createElement('div');
    win.className = 'window';
    win.id = `win-${appId}`;
    win.style.width = width + 'px';
    win.style.height = height + 'px';
    win.style.left = (100 + Math.random() * 200) + 'px';
    win.style.top = (80 + Math.random() * 100) + 'px';
    win.innerHTML = `
        <div class="window-header">
            <span class="window-title">${title}</span>
            <div class="window-controls">
                <div class="win-btn win-minimize" onclick="minimizeWindow('${appId}')"></div>
                <div class="win-btn win-maximize" onclick="maximizeWindow('${appId}')"></div>
                <div class="win-btn win-close" onclick="closeWindow('${appId}')"></div>
            </div>
        </div>
        <div class="window-content">${content}</div>
    `;
    document.body.appendChild(win);
    makeDraggable(win);
    activeWindows.add(appId);
    addToTaskbar(appId, title);
    return win;
}

function uploadImage() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                galleryImages.push({ id: Date.now(), name: file.name, data: ev.target.result, userId: currentUser.username });
                localStorage.setItem('persia_gallery', JSON.stringify(galleryImages));
                showNotification(`تصویر ${file.name} آپلود شد`, 'success');
                closeWindow('gallery');
                setTimeout(() => openGallery(), 100);

            reader.readAsDataURL(file);
        }
    };
    input.click();
}

function calcPress(btn) {
    const display = document.getElementById('calc-display');
    if (!display) return;
    if (btn === 'C') calcValue = '0';
    else if (btn === '=') {
        try { calcValue = eval(calcValue).toString(); } catch(e) { calcValue = 'Error'; }
    } else {
        if (calcValue === '0' && !isNaN(btn)) calcValue = btn;
        else calcValue += btn;
    }
    display.innerText = calcValue;
}

// ========== 8. مدیریت کاربران (فقط ادمین) ==========
function openUserManager() {
    if (currentUser.role !== 'admin') {
        showNotification('دسترسی غیرمجاز! فقط مدیر می‌تواند کاربران را مدیریت کند', 'error');
        return;
    }
    
    let usersHtml = '';
    for (const [username, user] of Object.entries(users)) {
        usersHtml += `
            <div style="background:rgba(0,0,0,0.2); border-radius:var(--radius-md); padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
                <div>
                    <strong>${username}</strong><br>
                    <small>نقش: ${user.role === 'admin' ? 'مدیر' : 'کاربر'} | وضعیت: ${user.isActive ? 'فعال' : 'غیرفعال'}</small>
                </div>
                <div style="display:flex; gap:8px;">
                    <button onclick="toggleUserStatus('${username}')" style="background:${user.isActive ? 'var(--warning)' : 'var(--success)'}; border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">${user.isActive ? 'غیرفعال' : 'فعال'}</button>
                    ${username !== 'admin' ? `<button onclick="deleteUser('${username}')" style="background:var(--error); border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">حذف</button>` : ''}
                    ${username !== currentUser.username ? `<button onclick="changeUserRole('${username}')" style="background:var(--primary); border:none; padding:6px 12px; border-radius:20px; cursor:pointer;">تغییر نقش</button>` : ''}
                </div>
            </div>
        `;
    }
    
    createWindow('user-manager', '👥 مدیریت کاربران', `
        <div style="margin-bottom:15px;">
            <h3>کاربران سیستم</h3>
        </div>
        <div id="users-list">
            ${usersHtml}
        </div>
        <div style="margin-top:15px; background:rgba(0,0,0,0.2); padding:12px; border-radius:var(--radius-md);">
            <p><strong>تعداد کل کاربران:</strong> ${Object.keys(users).length}</p>
        </div>
    `, 600, 500);
}

function toggleUserStatus(username) {
    if (users[username]) {
        users[username].isActive = !users[username].isActive;
        localStorage.setItem('persia_users', JSON.stringify(users));
        showNotification(`وضعیت کاربر ${username} تغییر کرد`, 'success');
        closeWindow('user-manager');
        setTimeout(() => openUserManager(), 100);
    }
}

function deleteUser(username) {
    if (confirm(`آیا کاربر ${username} حذف شود؟`)) {
        delete users[username];
        localStorage.setItem('persia_users', JSON.stringify(users));
        showNotification(`کاربر ${username} حذف شد`, 'success');
        closeWindow('user-manager');
        setTimeout(() => openUserManager(), 100);
    }
}

function changeUserRole(username) {
    const newRole = users[username].role === 'admin' ? 'user' : 'admin';
    users[username].role = newRole;
    localStorage.setItem('persia_users', JSON.stringify(users));
    showNotification(`نقش کاربر ${username} به ${newRole === 'admin' ? 'مدیر' : 'کاربر'} تغییر کرد`, 'success');
    closeWindow('user-manager');
    setTimeout(() => openUserManager(), 100);
}

// ========== 9. دستیار AI ==========
function toggleAIPanel() {
    const panel = document.getElementById('ai-panel');
    panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function askAI() {
    const input = document.getElementById('ai-input');
    const question = input.value.trim();
    if (!question) return;
    const container = document.getElementById('ai-conversation');
    container.innerHTML += `<div style="text-align:left; color:#86efac; margin:5px 0;">👤 ${escapeHtml(question)}</div>`;
    input.value = '';
    setTimeout(() => {
        let answer = generateAIResponse(question);
        container.innerHTML += `<div style="text-align:right; color:var(--primary); margin:5px 0;">🤖 ${answer}</div>`;
        container.scrollTop = container.scrollHeight;
    }, 500);
}

function generateAIResponse(question) {
    const q = question.toLowerCase();
    if (q.includes('سلام')) return 'سلام! وقت بخیر. به Persia OS خوش آمدید.';
    if (isGuest) return 'شما به عنوان مهمان وارد شده‌اید. لطفاً ثبت‌نام کنید تا از همه قابلیت‌ها استفاده کنید.';
    if (q.includes('چت')) return 'می‌توانید در بخش چت گروهی با سایر کاربران گفتگو کنید.';
    if (q.includes('موزیک') || q.includes('موسیقی')) return 'برای پخش موسیقی، روی آیکون 🎵 در دسکتاپ کلیک کنید.';
    if (q.includes('یادداشت')) return 'در بخش یادداشت‌ها می‌توانید یادداشت‌های خود را ذخیره کنید.';
    if (q.includes('گالری')) return 'در بخش گالری می‌توانید تصاویر خود را آپلود و مشاهده کنید.';
    if (q.includes('ادمین') || q.includes('مدیر')) return 'مدیر سیستم می‌تواند کاربران را مدیریت کند.';
    return 'سوال خوبی پرسیدی! از من هر سوالی داری بپرس.';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ========== 10. منوی استارت ==========
function toggleStartMenu() {
    const menu = document.getElementById('start-menu');
    menu.classList.toggle('show');
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('#start-menu') && !e.target.closest('.start-btn')) {
        document.getElementById('start-menu').classList.remove('show');
    }
    if (!e.target.closest('#ai-panel') && !e.target.closest('.ai-fab')) {
        document.getElementById('ai-panel').style.display = 'none';
    }
});

function shutdownSystem() {

    tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
        document.getElementById(`${target}-form`).classList.add('active');
        document.getElementById('register-error').style.display = 'none';
        document.getElementById('register-success').style.display = 'none';
        document.getElementById('login-error').style.display = 'none';
    });
});
