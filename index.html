<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست فایل‌های persiantechnet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #c9d1d9;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #30363d;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            margin-bottom: 10px;
        }

        .header p {
            color: #8b949e;
            font-size: 1rem;
        }

        .badge {
            display: inline-block;
            background: #238636;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 15px;
        }

        /* آمار */
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 24px;
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #58a6ff;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #8b949e;
        }

        /* جستجو */
        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.1);
        }

        /* لیست فایل‌ها */
        .file-list {
            background: #161b22;
            border-radius: 12px;
            border: 1px solid #30363d;
            overflow: hidden;
        }

        .list-header {
            display: grid;
            grid-template-columns: 40px 1fr 100px 120px;
            padding: 12px 16px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            font-weight: bold;
            color: #8b949e;
            font-size: 0.8rem;
        }

        .file-item {
            display: grid;
            grid-template-columns: 40px 1fr 100px 120px;
            padding: 12px 16px;
            border-bottom: 1px solid #21262d;
            transition: background 0.2s;
            align-items: center;
        }

        .file-item:hover {
            background: #1f242e;
        }

        .file-item a {
            color: #58a6ff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-item a:hover {
            text-decoration: underline;
        }

        .icon {
            font-size: 1.2rem;
        }

        .file-size {
            color: #8b949e;
            font-size: 0.85rem;
        }

        .file-date {
            color: #8b949e;
            font-size: 0.8rem;
        }

        .loading, .error, .empty {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .error {
            color: #f85149;
        }

        /* فوتر */
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #30363d;
            font-size: 0.8rem;
            color: #8b949e;
        }

        @media (max-width: 768px) {
            .list-header {
                display: none;
            }
            
            .file-item {
                grid-template-columns: 1fr;
                gap: 5px;
            }
            
            .file-size, .file-date {
                padding-right: 35px;
            }
            
            .stat-card {
                padding: 8px 16px;
            }
            
            .stat-number {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📁 persiantechnet</h1>
            <p>مخزن فایل‌های عمومی</p>
            <div class="badge">✨ لیست خودکار فایل‌ها با GitHub API</div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="fileCount">-</div>
                <div class="stat-label">فایل</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="folderCount">-</div>
                <div class="stat-label">پوشه</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalSize">-</div>
                <div class="stat-label">حجم کل</div>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 جستجو در فایل‌ها...">
        </div>

        <div class="file-list">
            <div class="list-header">
                <span></span>
                <span>نام فایل</span>
                <span>حجم</span>
                <span>آخرین بروزرسانی</span>
            </div>
            <div id="fileListContainer">
                <div class="loading">⏳ در حال بارگذاری فایل‌ها...</div>
            </div>
        </div>

        <div class="footer">
            <span>📡 داده‌ها از GitHub API دریافت می‌شوند • </span>
            <span>🔄 بروزرسانی خودکار هر بار بازدید</span>
        </div>
    </div>

    <script>
        // 👇 تنظیمات مخزن شما - این مقادیر را به درستی وارد کنید
        const REPO_OWNER = "persiantechnet";   // نام کاربری گیت‌هاب شما
        const REPO_NAME = "persiantechnet.github.io";  // نام مخزن
        
        // متغیرهای سراسری
        let allItems = [];
        let currentFilter = "";

        // تبدیل بایت به فرمت خوانا
        function formatFileSize(bytes) {
            if (bytes === 0) return "0 B";
            const k = 1024;
            const sizes = ["B", "KB", "MB", "GB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        }

        // فرمت تاریخ
        function formatDate(dateString) {
            if (!dateString) return "نامشخص";
            try {
                const date = new Date(dateString);
                return new Intl.DateTimeFormat('fa-IR').format(date);
            } catch {
                return dateString;
            }
        }

        // دریافت محتویات مخزن از GitHub API
        async function fetchRepositoryContents() {
            const container = document.getElementById('fileListContainer');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت اطلاعات از GitHub API...</div>';
            
            try {
                // استفاده از API گیت‌هاب برای دریافت محتویات
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
                console.log("در حال دریافت از:", url);
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`خطای HTTP: ${response.status} - ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log("داده دریافت شد:", data);
                
                if (!Array.isArray(data)) {
                    throw new Error("پاسخ API به فرمت مورد نظر نیست");
                }
                
                // پردازش داده‌ها
                allItems = data.map(item => ({
                    name: item.name,
                    type: item.type === 'dir' ? 'folder' : 'file',
                    size: item.size || 0,
                    url: item.html_url,
                    download_url: item.download_url,
                    date: formatDate(item.sha ? new Date().toISOString() : null) // برای تاریخ دقیق‌تر نیاز به درخواست جداگانه است
                }));
                
                // محاسبه آمار
                const files = allItems.filter(i => i.type === 'file');
                const folders = allItems.filter(i => i.type === 'folder');
                const totalSize = files.reduce((sum, f) => sum + f.size, 0);
                
                document.getElementById('fileCount').innerText = files.length;
                document.getElementById('folderCount').innerText = folders.length;
                document.getElementById('totalSize').innerText = formatFileSize(totalSize);
                
                // نمایش فایل‌ها
                renderFileList();
                
            } catch (error) {
                console.error("خطا:", error);
                container.innerHTML = `<div class="error">❌ خطا در دریافت فایل‌ها: ${error.message}<br><br>
                🔍 نکات بررسی:<br>
                1. مطمئن شوید مخزن شما عمومی (public) است<br>
                2. بررسی کنید نام مخزن و owner درست وارد شده باشد<br>
                3. اگر مخزن خالی است، ابتدا چند فایل به آن اضافه کنید<br>
                4. برای رفع خطا، می‌توانید از مرورگر خود مستقیماً این آدرس را تست کنید:<br>
                <code style="background:#0d1117;padding:4px;display:inline-block;margin-top:8px;">https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/</code>
                </div>`;
            }
        }

        // رندر لیست فایل‌ها با فیلتر جستجو
        function renderFileList() {
            const container = document.getElementById('fileListContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allItems;
            if (searchTerm) {
                filtered = allItems.filter(item => 
                    item.name.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">📭 هیچ فایلی با این جستجو یافت نشد</div>';
                return;
            }
            
            // مرتب‌سازی: پوشه‌ها اول، سپس فایل‌ها
            filtered.sort((a, b) => {
                if (a.type !== b.type) {
                    return a.type === 'folder' ? -1 : 1;
                }
                return a.name.localeCompare(b.name);
            });
            
            container.innerHTML = filtered.map(item => `
                <div class="file-item">
                    <span class="icon">${item.type === 'folder' ? '📁' : '📄'}</span>
                    <a href="${item.url}" target="_blank">
                        ${item.name}
                    </a>
                    <span class="file-size">${item.type === 'file' ? formatFileSize(item.size) : '—'}</span>
                    <span class="file-date">${item.date || '—'}</span>
                </div>
            `).join('');
        }

        // رویداد جستجو
        document.getElementById('searchInput').addEventListener('input', renderFileList);
        
        // اجرای اصلی
        fetchRepositoryContents();
    </script>
</body>
</html>
