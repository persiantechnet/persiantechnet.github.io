<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Persia OS Ultimate - سیستم عامل هوشمند پارسی</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%A1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --primary: #00aaff;
            --primary-dark: #0099ee;
            --secondary: #9d50bb;
            --success: #2ecc71;
            --error: #e74c3c;
            --warning: #f1c40f;
            --dark: #0a0a15;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(0, 170, 255, 0.3);
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: var(--dark);
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        /* والپیپر زنده متحرک */
        .live-wallpaper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            transition: all 0.5s ease;
        }
        .wallpaper-default {
            background: radial-gradient(circle at 20% 40%, #0a0a2a, #000010);
            animation: galaxyMove 20s ease infinite;
        }
        .wallpaper-matrix {
            background: linear-gradient(135deg, #003300, #000000);
        }
        .wallpaper-sunset {
            background: linear-gradient(135deg, #ff6b35, #f7931e, #2c3e50);
            animation: sunsetPulse 15s ease infinite;
        }
        .wallpaper-ocean {
            background: linear-gradient(135deg, #003366, #006699, #0099cc);
            animation: oceanWave 10s ease infinite;
        }
        @keyframes galaxyMove {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
        @keyframes sunsetPulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        @keyframes oceanWave {
            0% { background-size: 100% 100%; }
            50% { background-size: 120% 120%; }
            100% { background-size: 100% 100%; }
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .particle {
            position: absolute;
            background: rgba(0, 170, 255, 0.5);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            from { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            to { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        /* بوت اسکرین */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            z-index: 10000; transition: opacity 1s;
        }
        .boot-container { text-align: center; }
        .boot-logo { font-size: 5rem; animation: pulse 1s infinite; }
        .boot-progress { width: 300px; height: 4px; background: #333; margin: 1rem auto; border-radius: 2px; overflow: hidden; }
        .boot-progress-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        /* احراز هویت */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; transition: opacity 0.5s;
        }
        .auth-card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            padding: 2rem; width: 400px; max-width: 90%;
        }
        .auth-tabs { display: flex; gap: 10px; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); }
        .auth-tab { flex: 1; padding: 12px; background: none; border: none; color: #888; cursor: pointer; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .auth-input {
            width: 100%; padding: 12px; margin: 10px 0;
            background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
            border-radius: 12px; color: white;
        }
        .auth-btn {
            width: 100%; padding: 12px; margin-top: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; border-radius: 12px; color: white; font-weight: bold;
            cursor: pointer;
        }
        /* دسکتاپ */
        #desktop {
            width: 100%; height: calc(100vh - 55px);
            display: none; position: relative; overflow: auto;
        }
        .desktop-icons {
            position: absolute; top: 20px; right: 20px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 10;
        }
        .desktop-icon {
            width: 90px; padding: 12px 8px; text-align: center;
            background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            cursor: pointer; transition: all 0.3s;
        }
        .desktop-icon:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 0 20px rgba(0,170,255,0.3); }
        .desktop-icon .icon { font-size: 2rem; }
        .desktop-icon .label { font-size: 0.7rem; margin-top: 5px; }
        /* تسکبار */
        .taskbar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 55px;
            background: rgba(10, 10, 21, 0.95); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: none; justify-content: space-between; align-items: center;
            padding: 0 20px; z-index: 1000;
        }
        .start-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; padding: 8px 20px; border-radius: 12px;
            color: white; font-weight: bold; cursor: pointer;
        }
        .taskbar-apps { display: flex; gap: 8px; flex: 1; justify-content: center; }
        .taskbar-app {
            background: var(--glass); padding: 6px 14px; border-radius: 12px;
            font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .taskbar-right { display: flex; gap: 15px; font-size: 0.8rem; }
        /* منوی استارت */
        #start-menu {
            position: fixed; bottom: 60px; left: 20px; width: 350px;
            background: rgba(10, 10, 21, 0.98); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            display: none; z-index: 1100; max-height: 70vh; overflow-y: auto;
        }
        #start-menu.show { display: block; animation: slideUp 0.3s; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .start-header { background: linear-gradient(135deg, var(--primary-dark), var(--dark)); padding: 20px; text-align: center; border-radius: 16px 16px 0 0; }
        .start-item { padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 12px; margin: 4px 8px; }
        .start-item:hover { background: rgba(0,170,255,0.3); }
        /* پنجره‌ها */
        .window {
            position: absolute; background: rgba(20, 20, 40, 0.95); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            min-width: 400px; min-height: 350px; display: flex; flex-direction: column;
            z-index: 500; overflow: hidden;
        }
        .window-header { padding: 12px 18px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; cursor: move; }
        .window-controls { display: flex; gap: 10px; }
        .win-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .win-close { background: var(--error); }
        .win-minimize { background: var(--warning); }
        .win-maximize { background: var(--success); }
        .window-content { padding: 20px; flex: 1; overflow-y: auto; max-height: 70vh; }
        /* ویجت‌ها */
        .ai-fab {
            position: fixed; bottom: 70px; left: 20px;
            width: 55px; height: 55px; background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 900; box-shadow: 0 0 20px rgba(0,170,255,0.5);
        }
        .ai-panel {
            position: fixed; bottom: 135px; left: 20px; width: 350px;
            background: rgba(10, 10, 21, 0.98); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 15px; display: none; z-index: 901;
        }
        .notification { position: fixed; top: 20px; left: 20px; width: 340px;
            background: rgba(10,10,21,0.95); border-radius: 12px; padding: 12px;
            margin-bottom: 10px; border-right: 3px solid var(--primary);
            z-index: 2000; animation: slideIn 0.3s;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        /* پروفایل */
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin: 0 auto; display: block; border: 3px solid var(--primary); }
        /* فروشگاه */
        .store-item { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .store-item button { background: var(--primary); border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        /* اسکرول */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
    </style>
</head>
<body>

<div id="boot-screen"><div class="boot-container"><div class="boot-logo">📡</div><div class="boot-title">Persia OS Ultimate v13.0</div><div class="boot-progress"><div class="boot-progress-fill" id="boot-progress"></div></div><div class="boot-message" id="boot-message">در حال بارگذاری...</div></div></div>

<div id="auth-screen"><div class="auth-card"><div class="auth-tabs"><button class="auth-tab active" data-tab="login">🔐 ورود</button><button class="auth-tab" data-tab="register">📝 ثبت‌نام</button></div>
<div id="login-form" class="auth-form active"><input type="text" id="login-username" class="auth-input" placeholder="نام کاربری"><input type="password" id="login-password" class="auth-input" placeholder="رمز عبور"><button class="auth-btn" onclick="handleLogin()">✨ ورود</button><button class="auth-btn guest-btn" onclick="guestLogin()" style="background:#555;">👤 مهمان</button><div id="login-error" class="auth-error" style="color:red; display:none;"></div></div>
<div id="register-form" class="auth-form"><input type="text" id="reg-username" class="auth-input" placeholder="نام کاربری"><input type="password" id="reg-password" class="auth-input" placeholder="رمز عبور (min 4)"><input type="text" id="reg-name" class="auth-input" placeholder="نام کامل"><button class="auth-btn" onclick="handleRegister()">📝 ثبت‌نام</button><div id="register-error" style="color:red; display:none;"></div><div id="register-success" style="color:green; display:none;"></div></div></div></div>

<div id="desktop"><div class="live-wallpaper wallpaper-default" id="wallpaper"></div><div class="particles" id="particles"></div>
<div class="desktop-icons" id="desktop-icons"></div>
<div class="taskbar"><button class="start-btn" onclick="toggleStartMenu()">🚀 شروع</button><div class="taskbar-apps" id="taskbar-apps"></div><div class="taskbar-right"><span id="taskbar-time"></span><span id="taskbar-user"></span></div></div>
<div id="start-menu"><div class="start-header"><div class="start-user" id="start-username"></div><div class="start-user-status" id="start-role"></div></div><div id="start-menu-content"></div></div>
<div class="ai-fab" onclick="toggleAI()">🧠</div><div class="ai-panel" id="ai-panel"><h3 style="color:var(--primary);">🤖 Persia AI</h3><div id="ai-chat" style="height:200px; overflow-y:auto; background:rgba(0,0,0,0.3); border-radius:12px; padding:10px; margin-bottom:10px;"><div>سلام! به Persia OS خوش آمدید</div></div><textarea id="ai-input" placeholder="سوال..." style="width:100%; background:rgba(0,0,0,0.3); border:none; border-radius:12px; padding:10px; color:white;"></textarea><button onclick="askAI()" style="width:100%; margin-top:10px; background:var(--primary); border:none; padding:10px; border-radius:12px; cursor:pointer;">ارسال</button></div>
<div id="notification-center"></div></div>

<script>
// ==================== دیتابیس محلی (همان سرور) ====================
let users = JSON.parse(localStorage.getItem('persia_users_v2')) || {};
let currentUser = null;
let isGuest = false;
let activeWindows = new Set();
let windowZ = 1000;

// دیتای عمومی
let globalChat = JSON.parse(localStorage.getItem('global_chat')) || [];
let trashFiles = JSON.parse(localStorage.getItem('trash_files')) || [];
let storeTools = JSON.parse(localStorage.getItem('store_tools')) || [
    { id: 1, name: "🧹 پاک‌کن سیستم", price: "رایگان", type: "tool" },
    { id: 2, name: "🎨 والپیپر اختصاصی", price: "رایگان", type: "tool" },
    { id: 3, name: "🔒 آنتی‌ویروس پارسی", price: "پرمیوم", type: "tool" }
];
let userActivities = JSON.parse(localStorage.getItem('user_activities')) || {};
let wallpaperPreviews = ['default', 'matrix', 'sunset', 'ocean'];

// ایجاد ادمین پیش‌فرض
if (!users['admin']) {
    users['admin'] = { password: btoa('admin123'), name: 'مدیر سیستم', role: 'admin', avatar: '', joinDate: new Date().toISOString(), isActive: true, stats: { posts: 0, logins: 0 } };
    localStorage.setItem('persia_users_v2', JSON.stringify(users));
}

// ==================== بوت سیستم ====================
function bootSystem() {
    let progress = 0;
    let msgs = ['بارگذاری هسته...', 'راه‌اندازی ماژول‌ها...', 'اتصال به پایگاه داده...', 'آماده‌سازی محیط...'];
    let idx = 0;
    let int = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) progress = 100;
        document.getElementById('boot-progress').style.width = progress + '%';
        if (idx < msgs.length) document.getElementById('boot-message').innerText = msgs[idx++];
        if (progress === 100) {
            clearInterval(int);
            setTimeout(() => {
                document.getElementById('boot-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('boot-screen').style.display = 'none';
                    document.getElementById('auth-screen').style.display = 'flex';
                    setTimeout(() => document.getElementById('auth-screen').style.opacity = '1', 50);
                    startParticles();
                }, 500);
            }, 300);
        }
    }, 200);
}

function startParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 50; i++) {
        let p = document.createElement('div');
        p.className = 'particle';
        p.style.width = p.style.height = Math.random() * 4 + 2 + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = Math.random() * 10 + 5 + 's';
        p.style.animationDelay = Math.random() * 10 + 's';
        container.appendChild(p);
    }
}

// ==================== احراز هویت ====================
function handleLogin() {
    let username = document.getElementById('login-username').value.trim();
    let pass = document.getElementById('login-password').value;
    let user = users[username];
    if (!user || atob(user.password) !== pass) {
        document.getElementById('login-error').innerText = 'نام کاربری یا رمز اشتباه';
        document.getElementById('login-error').style.display = 'block';
        return;
    }
    if (!user.isActive) { showNotif('حساب غیرفعال است', 'error'); return; }
    currentUser = { username, name: user.name, role: user.role, avatar: user.avatar, stats: user.stats || { logins: 0 } };
    if (!user.stats) user.stats = { logins: 0 };
    user.stats.logins = (user.stats.logins || 0) + 1;
    user.lastLogin = new Date().toISOString();
    localStorage.setItem('persia_users_v2', JSON.stringify(users));
    isGuest = false;
    completeLogin();
}

function handleRegister() {
    let username = document.getElementById('reg-username').value.trim();
    let pass = document.getElementById('reg-password').value;
    let name = document.getElementById('reg-name').value.trim();
    if (!username || !pass || pass.length < 4) { showRegError('نام کاربری و رمز حداقل 4 کاراکتر'); return; }
    if (users[username]) { showRegError('نام کاربری تکراری'); return; }
    users[username] = {
        password: btoa(pass), name: name || username, role: 'user', avatar: '',
        joinDate: new Date().toISOString(), isActive: true, stats: { logins: 1, posts: 0 }
    };
    localStorage.setItem('persia_users_v2', JSON.stringify(users));
    document.getElementById('register-success').innerText = 'ثبت‌نام موفق! اکنون وارد شوید.';
    document.getElementById('register-success').style.display = 'block';
    setTimeout(() => { document.querySelector('.auth-tab[data-tab="login"]').click(); }, 1500);
}

function guestLogin() { currentUser = { username: 'مهمان', name: 'کاربر مهمان', role: 'guest' }; isGuest = true; completeLogin(); }

function completeLogin() {
    document.getElementById('auth-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('desktop').style.display = 'block';
        document.querySelector('.taskbar').style.display = 'flex';
        updateUI();
        startServices();
        showNotif(`به Persia OS خوش آمدید ${currentUser.name}`, 'success');
        recordActivity('ورود به سیستم');
    }, 500);
}

function updateUI() {
    document.getElementById('start-username').innerHTML = `${currentUser.name} 🟢`;
    document.getElementById('start-role').innerHTML = currentUser.role === 'admin' ? 'مدیر سیستم' : (isGuest ? 'مهمان' : 'کاربر');
    document.getElementById('taskbar-user').innerHTML = `👤 ${currentUser.name}`;
    buildDesktopIcons();
    buildStartMenu();
    updateDateTime();
    setInterval(updateDateTime, 1000);
}

function buildDesktopIcons() {
    let icons = [
        { id: 'chat', icon: '💬', label: 'چت گروهی', roles: ['user','admin','guest'] },
        { id: 'profile', icon: '👤', label: 'پروفایل من', roles: ['user','admin'] },
        { id: 'gallery', icon: '🖼️', label: 'گالری', roles: ['user','admin'] },
        { id: 'notes', icon: '📓', label: 'یادداشت', roles: ['user','admin'] },
        { id: 'trash', icon: '🗑️', label: 'سطل زباله', roles: ['user','admin'] },
        { id: 'store', icon: '🛒', label: 'فروشگاه', roles: ['user','admin'] },
        { id: 'settings', icon: '⚙️', label: 'تنظیمات', roles: ['user','admin'] },
        { id: 'wallpaper', icon: '🖌️', label: 'والپیپر', roles: ['user','admin'] }
    ];
    if (currentUser.role === 'admin') icons.push({ id: 'admin', icon: '👑', label: 'مدیریت', roles: ['admin'] });
    if (!isGuest) icons.push({ id: 'about', icon: 'ℹ️', label: 'درباره', roles: ['user','admin'] });
    let container = document.getElementById('desktop-icons');
    container.innerHTML = icons.filter(i => i.roles.includes(currentUser.role)).map(i => `<div class="desktop-icon" onclick="openApp('${i.id}')"><div class="icon">${i.icon}</div><div class="label">${i.label}</div></div>`).join('');
}

function buildStartMenu() {
    let items = [
        { id: 'chat', icon: '💬', label: 'چت گروهی' }, { id: 'profile', icon: '👤', label: 'پروفایل' },
        { id: 'gallery', icon: '🖼️', label: 'گالری' }, { id: 'store', icon: '🛒', label: 'فروشگاه' },
        { id: 'trash', icon: '🗑️', label: 'سطل زباله' }, { id: 'settings', icon: '⚙️', label: 'تنظیمات' }
    ];
    let html = `<div class="start-category"><div class="start-category-title">📱 برنامه‌ها</div>`;
    items.forEach(i => { html += `<div class="start-item" onclick="openApp('${i.id}'); toggleStartMenu()">${i.icon} ${i.label}</div>`; });
    html += `</div><div class="start-category"><div class="start-category-title">⚙️ سیستم</div>`;
    html += `<div class="start-item" onclick="logout()">🚪 خروج</div><div class="start-item" onclick="shutdown()">🔌 خاموش</div></div>`;
    document.getElementById('start-menu-content').innerHTML = html;
}

// ==================== پنجره‌ها ====================
function createWindow(id, title, content, w = 500, h = 450) {
    let exist = document.getElementById(`win-${id}`);
    if (exist) { exist.style.display = 'flex'; exist.style.zIndex = ++windowZ; return; }
    let win = document.createElement('div');
    win.className = 'window'; win.id = `win-${id}`;
    win.style.width = w + 'px'; win.style.height = h + 'px';
    win.style.left = (100 + Math.random() * 200) + 'px'; win.style.top = (80 + Math.random() * 100) + 'px';
    win.innerHTML = `<div class="window-header"><span>${title}</span><div class="window-controls"><div class="win-btn win-minimize" onclick="document.getElementById('win-${id}').style.display='none'"></div><div class="win-btn win-maximize" onclick="toggleMaximize('${id}')"></div><div class="win-btn win-close" onclick="closeWindow('${id}')"></div></div></div><div class="window-content">${content}</div>`;
    document.body.appendChild(win);
    makeDraggable(win);
    activeWindows.add(id);
    addToTaskbar(id, title);
    return win;
}

function closeWindow(id) { let w = document.getElementById(`win-${id}`); if (w) w.remove(); activeWindows.delete(id); removeTaskbar(id); }
function addToTaskbar(id, title) { if (!document.querySelector(`.taskbar-app[data-id="${id}"]`)) { let btn = document.createElement('div'); btn.className = 'taskbar-app'; btn.setAttribute('data-id', id); btn.innerHTML = `📌 ${title}`; btn.onclick = () => { let w = document.getElementById(`win-${id}`); if (w) w.style.display = 'flex'; }; document.getElementById('taskbar-apps').appendChild(btn); } }
function removeTaskbar(id) { let btn = document.querySelector(`.taskbar-app[data-id="${id}"]`); if (btn) btn.remove(); }
function toggleMaximize(id) { let win = document.getElementById(`win-${id}`); if (win.style.width === '90%') { win.style.width = '500px'; win.style.height = '450px'; win.style.left = '100px'; } else { win.style.width = '90%'; win.style.height = '80%'; win.style.left = '5%'; win.style.top = '5%'; } }
function makeDraggable(win) { let header = win.querySelector('.window-header'); let isDown = false, offX, offY; header.addEventListener('mousedown', (e) => { if (e.target.closest('.window-controls')) return; isDown = true; offX = e.clientX - win.offsetLeft; offY = e.clientY - win.offsetTop; win.style.zIndex = ++windowZ; }); document.addEventListener('mousemove', (e) => { if (!isDown) return; win.style.left = (e.clientX - offX) + 'px'; win.style.top = (e.clientY - offY) + 'px'; }); document.addEventListener('mouseup', () => isDown = false); }

// ==================== برنامه‌ها ====================
window.openApp = function(id) {
    if (id === 'chat') openChat();
    else if (id === 'profile') openProfile();
    else if (id === 'gallery') openGallery();
    else if (id === 'notes') openNotes();
    else if (id === 'trash') openTrash();
    else if (id === 'store') openStore();
    else if (id === 'settings') openSettings();
    else if (id === 'wallpaper') openWallpaper();
    else if (id === 'admin') openAdmin();
    else if (id === 'about') openAbout();
};

function openChat() {
    let msgs = globalChat.map(m => `<div style="margin-bottom:10px; text-align:${m.sender === currentUser?.username ? 'left' : 'right'}"><div style="display:inline-block; background:${m.sender === currentUser?.username ? '#00aaff' : '#334155'}; padding:8px 14px; border-radius:18px; max-width:80%"><b>${m.sender}</b><br>${escapeHtml(m.text)}<br><small style="opacity:0.6">${new Date(m.time).toLocaleTimeString()}</small></div></div>`).join('');
    createWindow('chat', '💬 چت گروهی (همگانی)', `<div id="chat-area" style="height:300px; overflow-y:auto; background:rgba(0,0,0,0.2); border-radius:12px; padding:10px; margin-bottom:10px;">${msgs || 'پیامی نیست'}</div><div style="display:flex; gap:8px;"><input type="text" id="chat-input" placeholder="پیام..." style="flex:1; background:rgba(0,0,0,0.3); border:none; padding:10px; border-radius:12px; color:white;"><button onclick="sendChat()" style="background:var(--primary); border:none; padding:10px 20px; border-radius:12px; cursor:pointer;">📨</button></div>`, 550, 480);
}
function sendChat() {
    let input = document.getElementById('chat-input');
    if (!input || !input.value.trim() || isGuest) { if(isGuest) showNotif('مهمان نمی‌تواند پیام دهد','error'); return; }
    let msg = { sender: currentUser.username, text: input.value.trim(), time: new Date().toISOString() };
    globalChat.push(msg);
    localStorage.setItem('global_chat', JSON.stringify(globalChat));
    input.value = '';
    closeWindow('chat'); setTimeout(() => openChat(), 100);
    recordActivity('ارسال پیام');
}

function openProfile() {
    let user = users[currentUser.username];
    let stats = user?.stats || { logins: 0, posts: 0 };
    createWindow('profile', '👤 پروفایل من', `<div style="text-align:center"><img class="profile-avatar" src="${user?.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%2300aaff%22/%3E%3Ctext x=%2250%22 y=%2270%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22%3E👤%3C/text%3E%3C/svg%3E'}" style="width:100px;height:100px;border-radius:50%;margin-bottom:15px;"><br><h3>${user?.name || currentUser.name}</h3><p>@${currentUser.username}</p><p>نقش: ${user?.role === 'admin' ? 'مدیر' : 'کاربر'}</p><p>📅 عضویت: ${new Date(user?.joinDate).toLocaleDateString() || 'نامشخص'}</p><p>🔐 تعداد ورود: ${stats.logins || 0}</p><p>💬 فعالیت‌ها: ${stats.posts || 0}</p><button onclick="changeAvatar()" style="background:var(--primary); border:none; padding:8px 20px; border-radius:20px; margin-top:15px; cursor:pointer;">تغییر عکس</button></div>`, 450, 550);
}
function changeAvatar() { let url = prompt('لینک عکس پروفایل را وارد کنید:'); if(url) { users[currentUser.username].avatar = url; localStorage.setItem('persia_users_v2', JSON.stringify(users)); showNotif('عکس تغییر کرد','success'); closeWindow('profile'); setTimeout(()=>openProfile(),100); } }

function openGallery() { createWindow('gallery', '🖼️ گالری', `<div>گالری در حال توسعه...<br><button onclick="showNotif('در نسخه بعدی','info')" style="background:var(--primary);border:none;padding:8px;border-radius:12px;">آپلود</button></div>`, 400,300); }
function openNotes() { createWindow('notes', '📓 یادداشت', `<textarea id="user-note" style="width:100%;height:200px;background:rgba(0,0,0,0.3);border:none;border-radius:12px;padding:10px;color:white;"></textarea><button onclick="saveNote()" style="margin-top:10px;background:var(--primary);border:none;padding:8px;border-radius:12px;">ذخیره</button><div id="saved-note"></div>`, 450,400); }
function openTrash() { let trashList = trashFiles.map((f,i) => `<div style="background:rgba(0,0,0,0.3);padding:10px;margin:5px;border-radius:8px;display:flex;justify-content:space-between"><span>🗑️ ${f.name}</span><button onclick="restoreFile(${i})" style="background:var(--success);border:none;padding:4px 12px;border-radius:8px;">بازیابی</button></div>`).join('') || 'سطل زباله خالی است'; createWindow('trash', '🗑️ سطل زباله', trashList, 450,400); }
function restoreFile(i) { let f = trashFiles.splice(i,1)[0]; localStorage.setItem('trash_files', JSON.stringify(trashFiles)); showNotif(`${f.name} بازیابی شد`,'success'); closeWindow('trash'); setTimeout(()=>openTrash(),100); }
function openStore() { let toolsHtml = storeTools.map(t => `<div class="store-item"><span>${t.name}</span><button onclick="installTool(${t.id})">📥 نصب</button></div>`).join(''); createWindow('store', '🛒 فروشگاه ابزارها', `<h3>ابزارهای قابل نصب</h3>${toolsHtml}<hr><div><input type="text" id="new-tool-name" placeholder="نام ابزار جدید" style="background:rgba(0,0,0,0.3);border:none;padding:8px;border-radius:12px;"><button onclick="addTool()" style="margin-top:8px;background:var(--success);border:none;padding:8px 16px;border-radius:12px;">➕ افزودن ابزار (ادمین)</button></div>`, 500,450); }
function installTool(id) { showNotif('ابزار نصب شد!', 'success'); recordActivity('نصب ابزار'); }
function addTool() { if(currentUser.role !== 'admin') { showNotif('فقط ادمین','error'); return; } let name = document.getElementById('new-tool-name')?.value; if(name) { storeTools.push({ id: Date.now(), name, price: 'رایگان' }); localStorage.setItem('store_tools', JSON.stringify(storeTools)); showNotif('ابزار اضافه شد','success'); closeWindow('store'); setTimeout(()=>openStore(),100); } }
function openSettings() { createWindow('settings', '⚙️ تنظیمات', `<div><button onclick="changePassword()" style="background:var(--warning);border:none;padding:8px;border-radius:12px;margin:5px;">🔒 تغییر رمز</button><button onclick="clearData()" style="background:var(--error);border:none;padding:8px;border-radius:12px;margin:5px;">🗑️ پاک کردن کش</button></div>`, 400,300); }
function openWallpaper() { createWindow('wallpaper', '🖌️ والپیپر زنده', `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${wallpaperPreviews.map(w => `<div onclick="setWallpaper('${w}')" style="background:${w === 'default' ? '#0a0a2a' : w === 'matrix' ? '#003300' : w === 'sunset' ? '#ff6b35' : '#003366'}; height:100px; border-radius:12px; cursor:pointer; text-align:center; line-height:100px;">${w}</div>`).join('')}</div><p>والپیپرهای زنده با انیمیشن</p>`, 450,400); }
function setWallpaper(type) { let wp = document.getElementById('wallpaper'); wp.classList.remove('wallpaper-default','wallpaper-matrix','wallpaper-sunset','wallpaper-ocean'); wp.classList.add(`wallpaper-${type}`); localStorage.setItem('selected_wallpaper', type); showNotif(`والپیپر ${type} تنظیم شد`,'success'); }
function openAdmin() { if(currentUser.role !== 'admin') return; let userList = Object.entries(users).map(([u,data]) => `<div style="display:flex;justify-content:space-between;padding:8px;background:rgba(0,0,0,0.3);margin:5px;border-radius:8px"><span>${u} (${data.role})</span><div><button onclick="toggleUser('${u}')" style="background:var(--warning);border:none;padding:4px 8px;border-radius:8px;">${data.isActive ? 'غیرفعال' : 'فعال'}</button><button onclick="deleteUser('${u}')" style="background:var(--error);border:none;padding:4px 8px;border-radius:8px;">حذف</button></div></div>`).join(''); createWindow('admin', '👑 مدیریت سیستم', `<h3>مدیریت کاربران</h3>${userList}<hr><h3>آمار</h3><p>کل کاربران: ${Object.keys(users).length}</p><button onclick="viewStats()" style="background:var(--primary);border:none;padding:8px;border-radius:12px;">مشاهده آمار بازدید</button>`, 550,500); }
function toggleUser(u) { users[u].isActive = !users[u].isActive; localStorage.setItem('persia_users_v2', JSON.stringify(users)); showNotif(`وضعیت ${u} تغییر کرد`,'success'); closeWindow('admin'); setTimeout(()=>openAdmin(),100); }
function deleteUser(u) { if(u === 'admin') { showNotif('ادمین قابل حذف نیست','error'); return; } delete users[u]; localStorage.setItem('persia_users_v2', JSON.stringify(users)); showNotif(`کاربر ${u} حذف شد`,'success'); closeWindow('admin'); setTimeout(()=>openAdmin(),100); }
function viewStats() { let act = JSON.parse(localStorage.getItem('user_activities')) || {}; let html = Object.entries(act).slice(-10).map(([u,a]) => `<div>${u}: ${a.length} فعالیت</div>`).join(''); alert('آخرین فعالیت‌ها:\n' + html); }
function openAbout() { createWindow('about', 'ℹ️ درباره', `<div style="text-align:center"><h2>Persia OS Ultimate v13.0</h2><p>سیستم عامل پارسی با قابلیت‌های کامل</p><p>📧 persiantechnet@gmail.com</p><p>📞 09373622762</p></div>`, 400,350); }
function changePassword() { let newPass = prompt('رمز جدید (min 4)'); if(newPass && newPass.length >=4 && !isGuest) { users[currentUser.username].password = btoa(newPass); localStorage.setItem('persia_users_v2', JSON.stringify(users)); showNotif('رمز تغییر کرد','success'); } else showNotif('خطا','error'); }
function clearData() { if(confirm('آیا کش پاک شود؟')) { localStorage.removeItem('global_chat'); showNotif('کش پاک شد','success'); } }
function saveNote() { let note = document.getElementById('user-note')?.value; if(note) { localStorage.setItem(`note_${currentUser.username}`, note); document.getElementById('saved-note').innerHTML = 'ذخیره شد!'; } }
function recordActivity(act) { let acts = JSON.parse(localStorage.getItem('user_activities')) || {}; if(!acts[currentUser.username]) acts[currentUser.username] = []; acts[currentUser.username].push({ action: act, time: new Date().toISOString() }); localStorage.setItem('user_activities', JSON.stringify(acts)); }

// ==================== چت همگانی با BroadcastChannel ====================
const chatChannel = new BroadcastChannel('persia_global_chat');
chatChannel.onmessage = (e) => { if(e.data.type === 'new_msg') { globalChat.push(e.data.msg); localStorage.setItem('global_chat', JSON.stringify(globalChat)); if(document.getElementById('win-chat')) { closeWindow('chat'); setTimeout(()=>openChat(),100); } } };
let originalSend = window.sendChat;
window.sendChat = function() { let input = document.getElementById('chat-input'); if(input && input.value.trim() && !isGuest) { let msg = { sender: currentUser.username, text: input.value.trim(), time: new Date().toISOString() }; globalChat.push(msg); localStorage.setItem('global_chat', JSON.stringify(globalChat)); chatChannel.postMessage({ type: 'new_msg', msg }); input.value = ''; closeWindow('chat'); setTimeout(()=>openChat(),100); recordActivity('چت'); } else if(isGuest) showNotif('مهمان نمی‌تواند پیام دهد','error'); };

// ==================== یوتیلیتی ====================
function showNotif(msg, type='info') { let div = document.createElement('div'); div.className = 'notification'; div.style.borderRightColor = type==='success'?'#2ecc71':type==='error'?'#e74c3c':'#f1c40f'; div.innerHTML = `<strong>${type==='success'?'✓':type==='error'?'⚠':'ℹ'}</strong> ${msg}`; document.getElementById('notification-center').appendChild(div); setTimeout(()=>div.remove(),4000); }
function updateDateTime() { let d = new Date(); document.getElementById('taskbar-time').innerHTML = d.toLocaleTimeString('fa-IR'); }
function toggleStartMenu() { document.getElementById('start-menu').classList.toggle('show'); }
function toggleAI() { let p = document.getElementById('ai-panel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
function askAI() { let q = document.getElementById('ai-input').value; if(!q) return; let chatDiv = document.getElementById('ai-chat'); chatDiv.innerHTML += `<div>👤 ${escapeHtml(q)}</div>`; setTimeout(()=>{ chatDiv.innerHTML += `<div style="color:var(--primary)">🤖 پاسخ: ${q.includes('سلام')?'سلام! خوش آمدید':q.includes('چت')?'چت گروهی همگانی است':q.includes('والپیپر')?'به بخش والپیپر بروید':'سوال خوبی است!'}</div>`; document.getElementById('ai-input').value=''; chatDiv.scrollTop=chatDiv.scrollHeight; },500); }
function escapeHtml(t) { let d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
function logout() { if(confirm('خروج؟')) location.reload(); }
function shutdown() { if(confirm('خاموش؟')) document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:white"><h1>سیستم خاموش شد 🔴</h1></div>'; }
function startServices() { let savedWp = localStorage.getItem('selected_wallpaper'); if(savedWp) setWallpaper(savedWp); }
document.addEventListener('click',(e)=>{ if(!e.target.closest('#start-menu')&&!e.target.closest('.start-btn')) document.getElementById('start-menu').classList.remove('show'); if(!e.target.closest('#ai-panel')&&!e.target.closest('.ai-fab')) document.getElementById('ai-panel').style.display='none'; });
document.querySelectorAll('.auth-tab').forEach(t=>{ t.addEventListener('click',()=>{ document.querySelectorAll('.auth-tab').forEach(ta=>ta.classList.remove('active')); t.classList.add('active'); let target=t.dataset.tab; document.querySelectorAll('.auth-form').forEach(f=>f.classList.remove('active')); document.getElementById(`${target}-form`).classList.add('active'); }); });
function showRegError(msg) { let e=document.getElementById('register-error'); e.innerText=msg; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }
document.addEventListener('DOMContentLoaded', bootSystem);
</script>
</body>
